<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="t d">
  <title id="t">Sigil nasıl çalışır: sunucuna kilit gider, anahtar sende kalır</title>
  <desc id="d">Gizli anahtar Mac'teki kasada (Secure Enclave, 1Password ya da Keychain) doğar ve hiç dışarı çıkmaz. Sunucuya yalnızca ona uyan kilit, yani açık anahtar takılır. Girişte sunucu bir soru sorar, kasa Touch ID ile imzalar ve yalnızca imza gider. Sunucu eklerken: kimliği onaylarsın, anahtar kasada doğar, kilit şifrenle bir kez takılır, yeni anahtarla giriş denenir. Güvenceler: şifren saklanmaz, 1Password'deki diğer kayıtların okunmaz, sahte sunucuya bağlanılmaz, hiçbir veri toplanmaz.</desc>
  <defs>
    <style>
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
      .sans  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .eyebrow { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #26215C; fill-opacity: .5; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 13px; fill: #26215C; fill-opacity: .72; }
    </style>
    <marker id="aGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#0F6E56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="aInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#534AB7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <!-- Small glyphs -->
    <g id="check"><circle r="14" fill="#0F6E56"/><path d="M-6,0.5 L-1.8,4.6 L6.2,-4.4" fill="none" stroke="#FFFDF8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="padlock"><path d="M-9,-2 v-6 a9,9 0 0 1 18,0 v6" fill="none" stroke="#534AB7" stroke-width="3.4"/><rect x="-14" y="-3" width="28" height="22" rx="5" fill="#534AB7"/><circle cy="6" r="3" fill="#FFFDF8"/><rect x="-1.2" y="7" width="2.4" height="6" rx="1.2" fill="#FFFDF8"/></g>
    <g id="fingerprint" fill="none" stroke="#FFFDF8" stroke-width="1.6" stroke-linecap="round">
      <path d="M-7,3 a7.5,7.5 0 0 1 13,-8"/><path d="M-4,7 a4.5,4.5 0 0 1 7,-6 v3"/><path d="M0,2 v7"/><path d="M7,-1 v4 a7,7 0 0 1 -2,6"/>
    </g>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="860" rx="24" fill="#F7F4EC"/>
  <rect x="0.5" y="0.5" width="1199" height="859" rx="23.5" fill="none" stroke="#26215C" stroke-opacity=".10"/>

  <!-- Header -->
  <text x="600" y="66" text-anchor="middle" class="serif" font-size="31" font-weight="700" fill="#26215C">Sunucuna kilit gider, anahtar sende kalır.</text>
  <text x="600" y="98" text-anchor="middle" class="sans" font-size="15.5" fill="#26215C" fill-opacity=".62">Sigil, SSH’ın kendi güvenlik modelini kullanır: gizli anahtar Mac’indeki kasadan hiç çıkmaz, sunucuya yalnızca ona uyan kilit takılır.</text>

  <!-- ============ Hero: your Mac ============ -->
  <rect x="40" y="136" width="380" height="304" rx="20" fill="#FFFDF8" stroke="#26215C" stroke-opacity=".12"/>
  <text x="64" y="166" class="eyebrow">SENİN MAC’İN</text>

  <!-- Safe -->
  <rect x="180" y="178" width="100" height="94" rx="16" fill="#26215C"/>
  <rect x="190" y="188" width="80" height="74" rx="10" fill="none" stroke="#FFFDF8" stroke-opacity=".22"/>
  <rect x="181" y="196" width="6" height="14" rx="2" fill="#FFFDF8" fill-opacity=".35"/>
  <rect x="181" y="240" width="6" height="14" rx="2" fill="#FFFDF8" fill-opacity=".35"/>
  <!-- Key inside the safe -->
  <g transform="translate(230 225)" fill="none" stroke="#5DCAA5" stroke-width="3.2" stroke-linecap="round">
    <circle cx="-12" cy="0" r="8.5"/><path d="M-3.5,0 H18 M12,0 v7 M17,0 v5"/>
  </g>
  <!-- Touch ID badge -->
  <circle cx="282" cy="270" r="19" fill="#0F6E56" stroke="#FFFDF8" stroke-width="3"/>
  <use href="#fingerprint" transform="translate(282 270)"/>

  <text x="230" y="314" text-anchor="middle" class="serif" font-size="23" font-weight="700" fill="#26215C">Kasa</text>
  <text x="230" y="340" text-anchor="middle" class="sans" font-size="14.5" fill="#26215C" fill-opacity=".75">Gizli anahtar burada doğar</text>
  <text x="230" y="360" text-anchor="middle" class="sans" font-size="14.5" fill="#26215C" fill-opacity=".75">ve dışarı hiç çıkmaz.</text>
  <g class="sans" font-size="12" font-weight="600" fill="#26215C" fill-opacity=".8">
    <rect x="86.5" y="378.5" width="116" height="26" rx="13" fill="#26215C" fill-opacity=".05" stroke="#26215C" stroke-opacity=".18"/>
    <text x="144.5" y="396" text-anchor="middle">Secure Enclave</text>
    <rect x="210.5" y="378.5" width="84" height="26" rx="13" fill="#26215C" fill-opacity=".05" stroke="#26215C" stroke-opacity=".18"/>
    <text x="252.5" y="396" text-anchor="middle">1Password</text>
    <rect x="302.5" y="378.5" width="76" height="26" rx="13" fill="#26215C" fill-opacity=".05" stroke="#26215C" stroke-opacity=".18"/>
    <text x="340.5" y="396" text-anchor="middle">Keychain</text>
  </g>
  <text x="230" y="425" text-anchor="middle" class="sans" font-size="11.5" fill="#0F6E56" font-weight="600">Secure Enclave ve 1Password girişte Touch ID ister</text>

  <!-- ============ Hero: the channel ============ -->
  <rect x="440" y="226" width="320" height="122" rx="61" fill="#0F6E56" fill-opacity=".07" stroke="#0F6E56" stroke-opacity=".35"/>
  <rect x="507" y="211" width="186" height="30" rx="15" fill="#F7F4EC" stroke="#0F6E56" stroke-opacity=".55"/>
  <g transform="translate(528 226) scale(.5)"><path d="M-9,-2 v-6 a9,9 0 0 1 18,0 v6" fill="none" stroke="#0F6E56" stroke-width="3.6"/><rect x="-14" y="-3" width="28" height="22" rx="5" fill="#0F6E56"/></g>
  <text x="541" y="231" class="sans" font-size="12.5" font-weight="700" fill="#0F6E56">uçtan uca şifreli SSH</text>

  <text x="600" y="270" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#534AB7">① Sunucu sorar: “anahtarın var mı?”</text>
  <path d="M742 282 H 460" stroke="#534AB7" stroke-width="2" fill="none" marker-end="url(#aInk)"/>
  <text x="600" y="312" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#0F6E56">② Kasa Touch ID ile imzalar, imza gider</text>
  <path d="M458 324 H 740" stroke="#0F6E56" stroke-width="2" fill="none" marker-end="url(#aGreen)"/>

  <text x="600" y="380" text-anchor="middle" class="sans" font-size="13.5" font-weight="700" fill="#0F6E56">Anahtarın kendisi hiçbir zaman ağa çıkmaz.</text>
  <text x="600" y="401" text-anchor="middle" class="sans" font-size="12" fill="#26215C" fill-opacity=".6">Her imza yalnızca o girişe özeldir, tekrar kullanılamaz.</text>

  <!-- ============ Hero: the server ============ -->
  <rect x="780" y="136" width="380" height="304" rx="20" fill="#FFFDF8" stroke="#26215C" stroke-opacity=".12"/>
  <text x="804" y="166" class="eyebrow">SUNUCUN</text>

  <!-- Server rack -->
  <g>
    <rect x="922" y="180" width="96" height="26" rx="6" fill="#26215C" fill-opacity=".08" stroke="#26215C" stroke-opacity=".35" stroke-width="1.5"/>
    <rect x="922" y="212" width="96" height="26" rx="6" fill="#26215C" fill-opacity=".08" stroke="#26215C" stroke-opacity=".35" stroke-width="1.5"/>
    <rect x="922" y="244" width="96" height="26" rx="6" fill="#26215C" fill-opacity=".08" stroke="#26215C" stroke-opacity=".35" stroke-width="1.5"/>
    <g fill="#0F6E56"><circle cx="936" cy="193" r="3"/><circle cx="936" cy="225" r="3"/><circle cx="936" cy="257" r="3"/></g>
    <g stroke="#26215C" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"><path d="M950 193 h34 M950 225 h34 M950 257 h34"/></g>
  </g>
  <use href="#padlock" transform="translate(1020 262)"/>

  <text x="970" y="314" text-anchor="middle" class="serif" font-size="23" font-weight="700" fill="#26215C">Kilit</text>
  <text x="970" y="340" text-anchor="middle" class="sans" font-size="14.5" fill="#26215C" fill-opacity=".75">Sunucuda yalnızca açık anahtar durur.</text>
  <text x="970" y="360" text-anchor="middle" class="sans" font-size="14.5" fill="#26215C" fill-opacity=".75">Kopyalansa bile kapıyı açmaz.</text>
  <rect x="879.5" y="378.5" width="181" height="26" rx="8" fill="#26215C" fill-opacity=".05" stroke="#26215C" stroke-opacity=".18"/>
  <text x="970" y="396" text-anchor="middle" class="mono" font-size="12" fill="#26215C" fill-opacity=".8">~/.ssh/authorized_keys</text>
  <text x="970" y="425" text-anchor="middle" class="sans" font-size="11.5" fill="#534AB7" font-weight="600">Yalnızca senin kasandaki anahtar bu kilide uyar</text>

  <!-- ============ Steps ============ -->
  <text x="40" y="486" class="eyebrow">BİR SUNUCU EKLEDİĞİNDE</text>
  <g>
    <!-- 1 -->
    <circle cx="58" cy="516" r="15" fill="#26215C"/>
    <text x="58" y="521" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#FFFDF8">1</text>
    <text x="84" y="522" class="serif" font-size="17" font-weight="700" fill="#26215C">Kimliği onaylarsın</text>
    <text x="40" y="554" class="body">Sunucunun parmak izini görürsün.</text>
    <text x="40" y="574" class="body">Onay vermeden şifre gönderilmez.</text>
    <path d="M296 512 l7 5 l-7 5" fill="none" stroke="#26215C" stroke-opacity=".3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 2 -->
    <circle cx="338" cy="516" r="15" fill="#26215C"/>
    <text x="338" y="521" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#FFFDF8">2</text>
    <text x="364" y="522" class="serif" font-size="17" font-weight="700" fill="#26215C">Anahtar kasada doğar</text>
    <text x="320" y="554" class="body">Bu sunucuya özel, yepyeni bir anahtar.</text>
    <text x="320" y="574" class="body">Gizli kısmı kasadan hiç çıkmaz.</text>
    <path d="M576 512 l7 5 l-7 5" fill="none" stroke="#26215C" stroke-opacity=".3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 3 -->
    <circle cx="618" cy="516" r="15" fill="#26215C"/>
    <text x="618" y="521" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#FFFDF8">3</text>
    <text x="644" y="522" class="serif" font-size="17" font-weight="700" fill="#26215C">Kilit takılır</text>
    <text x="600" y="554" class="body">Şifren yalnızca bu adımda, bir kez</text>
    <text x="600" y="574" class="body">kullanılır ve hiçbir yere yazılmaz.</text>
    <path d="M856 512 l7 5 l-7 5" fill="none" stroke="#26215C" stroke-opacity=".3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 4 -->
    <circle cx="898" cy="516" r="15" fill="#26215C"/>
    <text x="898" y="521" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#FFFDF8">4</text>
    <text x="924" y="522" class="serif" font-size="17" font-weight="700" fill="#26215C">Giriş denenir</text>
    <text x="880" y="554" class="body">Yeni anahtarla giriş doğrulanır.</text>
    <text x="880" y="574" class="body">Olmazsa her şey geri alınır.</text>
  </g>
  <text x="40" y="610" class="sans" font-size="12.5" fill="#26215C" fill-opacity=".55">Anahtar düzenli olarak aynı yolla yenilenir: yeni kilit takılıp denenmeden eskisi sökülmez, kapıda kalmazsın.</text>

  <!-- ============ Guarantees ============ -->
  <text x="40" y="652" class="eyebrow">GÜVENCELER</text>
  <g>
    <rect x="40" y="668" width="268" height="156" rx="16" fill="#FFFDF8" stroke="#26215C" stroke-opacity=".12"/>
    <use href="#check" transform="translate(70 700)"/>
    <text x="60" y="742" class="serif" font-size="17" font-weight="700" fill="#26215C">Şifren saklanmaz</text>
    <text x="60" y="768" class="body">İlk kurulumda bir kez kullanılır.</text>
    <text x="60" y="788" class="body">Diske, ayarlara ya da Keychain’e</text>
    <text x="60" y="808" class="body">yazılmaz.</text>

    <rect x="324" y="668" width="268" height="156" rx="16" fill="#FFFDF8" stroke="#26215C" stroke-opacity=".12"/>
    <use href="#check" transform="translate(354 700)"/>
    <text x="344" y="742" class="serif" font-size="17" font-weight="700" fill="#26215C">1Password’ün kapalı kalır</text>
    <text x="344" y="768" class="body">Sigil yalnızca kendi ürettiği</text>
    <text x="344" y="788" class="body">anahtarın açık kısmını okur.</text>
    <text x="344" y="808" class="body">Diğer kayıtların listelenmez bile.</text>

    <rect x="608" y="668" width="268" height="156" rx="16" fill="#FFFDF8" stroke="#26215C" stroke-opacity=".12"/>
    <use href="#check" transform="translate(638 700)"/>
    <text x="628" y="742" class="serif" font-size="17" font-weight="700" fill="#26215C">Sahte sunucuya gitmez</text>
    <text x="628" y="768" class="body">Sunucunun parmak izi ilk gün</text>
    <text x="628" y="788" class="body">kaydedilir. Değişirse bağlantı</text>
    <text x="628" y="808" class="body">durur ve seni uyarır.</text>

    <rect x="892" y="668" width="268" height="156" rx="16" fill="#FFFDF8" stroke="#26215C" stroke-opacity=".12"/>
    <use href="#check" transform="translate(922 700)"/>
    <text x="912" y="742" class="serif" font-size="17" font-weight="700" fill="#26215C">Hiçbir veri toplamaz</text>
    <text x="912" y="768" class="body">Hesap, Sigil sunucusu, analitik</text>
    <text x="912" y="788" class="body">yok. Kendiliğinden yalnızca</text>
    <text x="912" y="808" class="body">sunuculara ve güncellemeye bağlanır.</text>
  </g>
</svg>
