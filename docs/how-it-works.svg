<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d">
  <title id="t">Sigil: ne nerede durur, ne nereye gider</title>
  <desc id="d">Private key ve diğer 1Password kayıtları Mac'te kalır. Sigil yalnızca açık anahtarı ve parmak izini görür. Sunucuya şifreli SSH kanalı üzerinden yalnızca ilk kurulumda bir kez şifre, sonra açık anahtar ve her girişte bir imza gider. Uygulama internete yalnızca SSH ile kendi sunucularına ve GitHub'daki imzalı güncelleme akışına bağlanır.</desc>
  <defs>
    <style>
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
      .sans  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .eyebrow { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #26215C; fill-opacity: .55; }
    </style>
    <polygon id="sigil" points="0.668,0.097 0.431,0.738 -0.218,0.566 -0.887,0.279 -0.646,-0.435 -0.055,-0.686 0.666,-0.625"/>
    <marker id="arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#534AB7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#9A5B0C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#0F6E56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="lock"><rect x="-7" y="-1" width="14" height="11" rx="2.5"/><path d="M-4.2,-1 v-3.2 a4.2,4.2 0 0 1 8.4,0 v3.2" fill="none" stroke-width="2"/></g>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="800" rx="24" fill="#F7F4EC"/>
  <rect x="0.5" y="0.5" width="1199" height="799" rx="23.5" fill="none" stroke="#26215C" stroke-opacity=".10"/>

  <!-- Header -->
  <use href="#sigil" transform="translate(1136 64) scale(26)" fill="none" stroke="#26215C" stroke-opacity=".8" stroke-width="0.092" stroke-linejoin="round"/>
  <text x="48" y="60" class="serif" font-size="29" font-weight="700" fill="#26215C">Ne nerede durur, ne nereye gider?</text>
  <text x="48" y="90" class="sans" font-size="15" fill="#26215C" fill-opacity=".62">Gizli olan her şey senin Mac’inde kalır. Sunucuya yalnızca açık anahtar gider; 1Password’deki diğer kayıtlarına hiç dokunulmaz.</text>

  <!-- ============ Zone: your Mac ============ -->
  <rect x="32" y="116" width="600" height="544" rx="18" fill="#FFFDF8" stroke="#26215C" stroke-opacity=".14"/>
  <g transform="translate(58 141)" fill="none" stroke="#26215C" stroke-opacity=".55" stroke-width="1.6" stroke-linejoin="round">
    <rect x="0" y="-9" width="18" height="12" rx="2"/><path d="M-3,5 h24"/>
  </g>
  <text x="86" y="146" class="eyebrow">SENİN MAC’İN</text>

  <!-- 1Password card -->
  <rect x="56" y="166" width="260" height="226" rx="14" fill="#26215C"/>
  <text x="78" y="199" class="serif" font-size="20" font-weight="700" fill="#FFFDF8">1Password</text>
  <use href="#lock" transform="translate(290 192)" fill="#FFFDF8" stroke="#FFFDF8"/>

  <rect x="70" y="214" width="232" height="48" rx="10" fill="#FFFDF8" fill-opacity=".10"/>
  <g transform="translate(88 238)" fill="none" stroke="#5DCAA5" stroke-width="1.8" stroke-linecap="round">
    <circle cx="-2" cy="0" r="5"/><path d="M3,0 h9 M9,0 v4 M12,0 v3"/>
  </g>
  <text x="108" y="234" class="mono" font-size="13" fill="#FFFDF8">Sigil – webserver</text>
  <text x="108" y="252" class="sans" font-size="11.5" fill="#AFA9EC">private key · hiç dışarı çıkmaz</text>

  <rect x="70.5" y="270.5" width="231" height="47" rx="10" fill="none" stroke="#FFFDF8" stroke-opacity=".28" stroke-dasharray="4 4"/>
  <use href="#lock" transform="translate(87 292) scale(.8)" fill="#FFFDF8" fill-opacity=".45" stroke="#FFFDF8" stroke-opacity=".45"/>
  <text x="108" y="290" class="sans" font-size="13" fill="#FFFDF8" fill-opacity=".6">Diğer tüm kayıtların</text>
  <text x="108" y="308" class="sans" font-size="11.5" fill="#5DCAA5">Sigil bunları listelemez, okumaz</text>

  <rect x="70" y="326" width="232" height="48" rx="10" fill="#FFFDF8" fill-opacity=".10"/>
  <g transform="translate(87 350)" fill="none" stroke="#FFFDF8" stroke-width="1.5" stroke-linecap="round">
    <path d="M-6,3 a7,7 0 0 1 12,-7"/><path d="M-3,6 a4,4 0 0 1 6,-6 v3"/><path d="M0,1 v6"/><path d="M6,-1 v4 a6,6 0 0 1 -2,5"/>
  </g>
  <text x="108" y="346" class="sans" font-size="13" font-weight="600" fill="#FFFDF8">SSH Agent</text>
  <text x="108" y="364" class="sans" font-size="11.5" fill="#AFA9EC">her girişte Touch ID ile onay</text>

  <!-- 1Password → Sigil -->
  <path d="M318 238 H 378" stroke="#534AB7" stroke-width="2" fill="none" marker-end="url(#arrInk)"/>
  <text x="348" y="222" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" fill="#534AB7">yalnızca</text>
  <text x="348" y="258" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" fill="#534AB7">açık anahtar</text>

  <!-- Sigil card -->
  <rect x="386" y="166" width="222" height="226" rx="14" fill="#F7F4EC" stroke="#26215C" stroke-opacity=".14"/>
  <use href="#sigil" transform="translate(414 192) scale(14)" fill="#534AB7" fill-opacity=".14" stroke="#26215C" stroke-width="0.143" stroke-linejoin="round"/>
  <text x="438" y="199" class="serif" font-size="20" font-weight="700" fill="#26215C">Sigil</text>
  <text x="404" y="228" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#0F6E56">BİLDİĞİ</text>
  <text x="404" y="248" class="sans" font-size="13" fill="#26215C">alias · IP · kullanıcı</text>
  <text x="404" y="267" class="sans" font-size="13" fill="#26215C">açık anahtar + parmak izi</text>
  <text x="404" y="300" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#C2491F">BİLMEDİĞİ</text>
  <text x="404" y="320" class="sans" font-size="13" fill="#26215C" fill-opacity=".7">private key</text>
  <text x="404" y="339" class="sans" font-size="13" fill="#26215C" fill-opacity=".7">sunucu şifresi (saklanmaz)</text>
  <text x="404" y="358" class="sans" font-size="13" fill="#26215C" fill-opacity=".7">diğer 1Password kayıtları</text>
  <text x="404" y="377" class="sans" font-size="13" fill="#26215C" fill-opacity=".7">analitik, hesap, bulut</text>

  <!-- ~/.ssh/config -->
  <rect x="56" y="412" width="552" height="90" rx="12" fill="#F7F4EC" stroke="#26215C" stroke-opacity=".14"/>
  <text x="74" y="438" class="mono" font-size="13" font-weight="700" fill="#26215C">~/.ssh/config</text>
  <text x="196" y="438" class="sans" font-size="11.5" fill="#26215C" fill-opacity=".55">yalnızca bir Include satırı · senin girdilerine dokunulmaz</text>
  <text x="74" y="463" class="mono" font-size="12.5" fill="#26215C" fill-opacity=".8">Host webserver</text>
  <text x="94" y="484" class="mono" font-size="12.5" fill="#26215C" fill-opacity=".8">IdentityFile …/webserver.pub   IdentitiesOnly yes</text>

  <!-- Terminal -->
  <rect x="56" y="520" width="552" height="116" rx="12" fill="#1C1B19"/>
  <circle cx="76" cy="538" r="5" fill="#F0997B"/><circle cx="93" cy="538" r="5" fill="#EF9F27"/><circle cx="110" cy="538" r="5" fill="#5DCAA5"/>
  <text x="76" y="570" class="mono" font-size="14" fill="#F7F4EC"><tspan fill="#AFA9EC">$</tspan> ssh webserver</text>
  <text x="76" y="594" class="mono" font-size="13" fill="#5DCAA5">✓ Touch ID · 1Password imzaladı, anahtarı vermedi</text>
  <text x="76" y="618" class="mono" font-size="13" fill="#F7F4EC" fill-opacity=".75">root@webserver:~# <tspan fill="#F7F4EC">▍</tspan></text>

  <!-- ============ Channel ============ -->
  <rect x="644" y="166" width="176" height="470" rx="20" fill="#0F6E56" fill-opacity=".06" stroke="#0F6E56" stroke-opacity=".4" stroke-dasharray="6 5"/>
  <use href="#lock" transform="translate(667 194) scale(.85)" fill="#0F6E56" stroke="#0F6E56"/>
  <text x="682" y="199" class="sans" font-size="12" font-weight="700" letter-spacing="1" fill="#0F6E56">SSH · ŞİFRELİ</text>

  <text x="732" y="244" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#9A5B0C">① şifre · tek sefer</text>
  <path d="M634 258 H 828" stroke="#9A5B0C" stroke-width="2" fill="none" marker-end="url(#arrAmber)"/>
  <text x="732" y="278" text-anchor="middle" class="sans" font-size="11" fill="#26215C" fill-opacity=".65">parmak izi onayından sonra</text>

  <text x="732" y="328" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#534AB7">② açık anahtar</text>
  <path d="M634 342 H 828" stroke="#534AB7" stroke-width="2" fill="none" marker-end="url(#arrInk)"/>
  <text x="732" y="362" text-anchor="middle" class="sans" font-size="11" fill="#26215C" fill-opacity=".65">authorized_keys’e yazılır</text>

  <text x="732" y="412" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#0F6E56">③ imza</text>
  <path d="M634 426 H 828" stroke="#0F6E56" stroke-width="2" fill="none" marker-end="url(#arrGreen)"/>
  <text x="732" y="446" text-anchor="middle" class="sans" font-size="11" fill="#26215C" fill-opacity=".65">her girişte · anahtar değil</text>

  <path d="M660 482 H 804" stroke="#C2491F" stroke-opacity=".35"/>
  <text x="732" y="506" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#C2491F">ASLA GEÇMEZ</text>
  <g class="sans" font-size="12.5" fill="#C2491F">
    <text x="732" y="534" text-anchor="middle" text-decoration="line-through">private key</text>
    <text x="732" y="558" text-anchor="middle" text-decoration="line-through">1Password içeriği</text>
    <text x="732" y="582" text-anchor="middle" text-decoration="line-through">diğer şifrelerin</text>
    <text x="732" y="606" text-anchor="middle" text-decoration="line-through">kayıtlı sunucu şifresi</text>
  </g>

  <!-- ============ Zone: server ============ -->
  <rect x="836" y="116" width="332" height="544" rx="18" fill="#FFFDF8" stroke="#26215C" stroke-opacity=".14"/>
  <g transform="translate(862 137)" fill="none" stroke="#26215C" stroke-opacity=".55" stroke-width="1.6">
    <rect x="0" y="-5" width="18" height="6" rx="1.5"/><rect x="0" y="3" width="18" height="6" rx="1.5"/>
  </g>
  <text x="890" y="146" class="eyebrow">SUNUCUN</text>

  <rect x="858" y="166" width="288" height="146" rx="14" fill="#F7F4EC" stroke="#26215C" stroke-opacity=".14"/>
  <text x="878" y="198" class="serif" font-size="19" font-weight="700" fill="#26215C">Host key</text>
  <circle cx="1108" cy="204" r="24" fill="#0F6E56" fill-opacity=".08" stroke="#0F6E56" stroke-opacity=".5"/>
  <use href="#sigil" transform="translate(1108 204) rotate(38) scale(17)" fill="none" stroke="#0F6E56" stroke-width="0.118" stroke-linejoin="round"/>
  <text x="878" y="240" class="sans" font-size="13" fill="#26215C" fill-opacity=".8">Sunucunun kimliği. Sigil ilk gün</text>
  <text x="878" y="259" class="sans" font-size="13" fill="#26215C" fill-opacity=".8">sen onaylayınca kaydeder.</text>
  <text x="878" y="288" class="sans" font-size="13" font-weight="600" fill="#C2491F">Değişirse bağlantı durur.</text>

  <rect x="858" y="328" width="288" height="146" rx="14" fill="#F7F4EC" stroke="#26215C" stroke-opacity=".14"/>
  <text x="878" y="360" class="mono" font-size="14" font-weight="700" fill="#26215C">authorized_keys</text>
  <rect x="876" y="374" width="252" height="28" rx="7" fill="#26215C" fill-opacity=".06"/>
  <text x="886" y="393" class="mono" font-size="11.5" fill="#26215C" fill-opacity=".75">ssh-ed25519 AAAAC3Nza… sigil</text>
  <text x="878" y="426" class="sans" font-size="13" fill="#26215C" fill-opacity=".8">Yalnızca açık anahtar durur.</text>
  <text x="878" y="445" class="sans" font-size="13" fill="#26215C" fill-opacity=".8">Sunucu ele geçse bile bununla</text>
  <text x="878" y="464" class="sans" font-size="13" fill="#26215C" fill-opacity=".8">başka bir yere girilemez.</text>

  <rect x="858" y="490" width="288" height="146" rx="14" fill="#F7F4EC" stroke="#26215C" stroke-opacity=".14"/>
  <text x="878" y="522" class="serif" font-size="19" font-weight="700" fill="#26215C">Düzenli yenileme</text>
  <g class="sans" font-size="12.5" fill="#26215C" fill-opacity=".8">
    <text x="878" y="550"><tspan fill="#534AB7" font-weight="700">1</tspan>  yeni anahtar kurulur</text>
    <text x="878" y="570"><tspan fill="#534AB7" font-weight="700">2</tspan>  yeni anahtarla giriş denenir</text>
    <text x="878" y="590"><tspan fill="#534AB7" font-weight="700">3</tspan>  ancak o zaman eskisi silinir</text>
  </g>
  <text x="878" y="618" class="sans" font-size="12.5" font-weight="600" fill="#0F6E56">Dışarıda kalma riski yok.</text>

  <!-- ============ Footer: the only outbound paths ============ -->
  <rect x="32" y="680" width="1136" height="88" rx="16" fill="#26215C"/>
  <text x="60" y="716" class="serif" font-size="19" font-weight="700" fill="#FFFDF8">Uygulamanın internete çıktığı yalnızca iki yol var</text>
  <text x="60" y="746" class="sans" font-size="13.5" fill="#FFFDF8" fill-opacity=".8">SSH → kendi sunucuların    ·    GitHub → imzalı güncelleme kontrolü (Sparkle, EdDSA)</text>
  <g class="sans" font-size="12.5" font-weight="600" fill="#5DCAA5">
    <rect x="790.5" y="710.5" width="104" height="30" rx="15" fill="none" stroke="#5DCAA5" stroke-opacity=".6"/>
    <text x="842.5" y="730" text-anchor="middle">analitik yok</text>
    <rect x="906.5" y="710.5" width="142" height="30" rx="15" fill="none" stroke="#5DCAA5" stroke-opacity=".6"/>
    <text x="977.5" y="730" text-anchor="middle">Sigil sunucusu yok</text>
    <rect x="1060.5" y="710.5" width="88" height="30" rx="15" fill="none" stroke="#5DCAA5" stroke-opacity=".6"/>
    <text x="1104.5" y="730" text-anchor="middle">hesap yok</text>
  </g>
</svg>
